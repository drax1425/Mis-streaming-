<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>CS2 Thumbnail V2 — "DESPUÉS DE AÑOS / VOLVÍ A DUST II"</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* V2-specific overrides */
    :root {
      --color-accent:       #00C8FF;  /* cyan accent — feels more nostalgic/cold */
      --color-text-sub:     #00C8FF;
      --color-glow:         rgba(0, 200, 255, 0.50);
      --color-badge-bg:     #0066AA;
    }
    /* V2 headline is two lines */
    .headline {
      font-size: 122px;
      line-height: 0.9;
    }
    /* Subheadline is the action line */
    .subheadline {
      font-size: 58px;
      color: #FFFFFF;
    }
    /* Map tag in V2 uses cyan */
    .map-tag {
      background: #00C8FF;
      color: #050E18;
      box-shadow: 0 4px 20px rgba(0,200,255,0.5);
    }
    .map-tag .dot { background: #050E18; }
    /* Badge */
    .badge-ribbon { background: #0066AA; }
    /* Kill feed uses AWP instead */
    .kf-weapon { color: #00C8FF; }
  </style>
</head>
<body>

<div class="thumbnail">

  <div class="bg-scene">
    <img class="bg-scene-img" src="assets/dust2-bg.jpg" alt=""
         onerror="this.style.display='none'" />
  </div>
  <div class="bg-stripe"></div>
  <div class="dust-overlay"></div>

  <!-- Badge V2 -->
  <div class="badge-ribbon">AÑOS DESPUÉS</div>

  <!-- Kill feed -->
  <div class="killfeed">
    <div class="killfeed-row">
      <span class="kf-you">Drax</span>
      <span class="kf-icon" style="background:#00C8FF"></span>
      <span class="kf-weapon">AWP</span>
      <span class="kf-enemy">enemy</span>
    </div>
  </div>

  <!-- Face -->
  <div class="face-panel">
    <div class="face-glow"></div>
    <img class="face-img" src="assets/drax-face.png" alt="Drax"
         onerror="this.style.display='none'" />
    <div class="face-placeholder"><span>Drax</span></div>
  </div>

  <!-- Weapon (AWP variant) -->
  <div class="weapon-container">
    <img class="weapon-img" src="assets/awp.png" alt="AWP"
         onerror="this.nextElementSibling.style.display='flex'; this.style.display='none'" />
    <div class="weapon-placeholder" id="weapon-svg-placeholder">
      <svg viewBox="0 0 520 100" width="520" height="100" xmlns="http://www.w3.org/2000/svg"
           style="filter:drop-shadow(0 0 18px rgba(0,200,255,.5))">
        <!-- AWP silhouette simplified -->
        <g fill="#9BA0A8" stroke="#3A3F45" stroke-width="1.5">
          <!-- Stock -->
          <rect x="0" y="40" width="110" height="28" rx="5"/>
          <rect x="8" y="30" width="18" height="14" rx="3"/>
          <!-- Grip -->
          <rect x="105" y="52" width="26" height="38" rx="5" transform="rotate(6,118,71)"/>
          <!-- Body -->
          <rect x="100" y="36" width="200" height="28" rx="5" fill="#7A8090"/>
          <!-- Scope -->
          <rect x="155" y="20" width="60" height="20" rx="4" fill="#2A2E35"/>
          <circle cx="165" cy="30" r="7" fill="#1A1E25" stroke="#555" stroke-width="1"/>
          <circle cx="165" cy="30" r="4" fill="#00C8FF" opacity="0.6"/>
          <!-- Barrel -->
          <rect x="285" y="44" width="220" height="12" rx="4" fill="#5A5E65" stroke="#333"/>
        </g>
        <ellipse cx="505" cy="50" rx="12" ry="6" fill="rgba(0,200,255,0.45)"/>
      </svg>
    </div>
  </div>

  <!-- Text block V2 -->
  <div class="text-block">
    <div class="headline">DESPUÉS<br/>DE <span class="accent">AÑOS</span></div>
    <div class="subheadline">VOLVÍ A DUST II</div>
    <div class="map-tag"><span class="dot"></span>DUST II<span class="dot"></span></div>
  </div>

  <div class="timestamp-zone"></div>
</div>

<script>
  document.querySelector('.weapon-img')?.addEventListener('load', () => {
    document.getElementById('weapon-svg-placeholder').style.display = 'none';
  });
</script>
</body>
</html>
