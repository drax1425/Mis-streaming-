<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>CS2 Thumbnail V3 — "PRIMERA PARTIDA / EN CS2 OTRA VEZ"</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* V3-specific overrides — warm green / CS2 classic palette */
    :root {
      --color-accent:       #2ECC71;  /* CS2 "match won" green */
      --color-text-sub:     #2ECC71;
      --color-glow:         rgba(46, 204, 113, 0.40);
      --color-glow-warm:    rgba(46, 204, 113, 0.25);
      --color-badge-bg:     #1A7A45;
    }
    /* V3 headline punchy 1-liners */
    .headline { font-size: 136px; }
    .subheadline {
      font-size: 62px;
      letter-spacing: 3px;
    }
    /* Map tag green */
    .map-tag {
      background: #2ECC71;
      color: #061510;
      box-shadow: 0 4px 20px rgba(46,204,113,0.5);
    }
    .map-tag .dot { background: #061510; }
    /* Badge */
    .badge-ribbon { background: #1A7A45; }
    /* Kill feed green accent */
    .kf-weapon { color: #2ECC71; }
    .kf-icon   { background: #2ECC71; }
    /* Stripe in green tint */
    .bg-stripe {
      background: linear-gradient(
        118deg,
        transparent 0%,
        transparent 38%,
        rgba(46, 204, 113, 0.06) 38%,
        rgba(46, 204, 113, 0.06) 40%,
        transparent 40%
      );
    }
    /* Highlight "OTRA VEZ" so it pops */
    .subheadline .accent {
      color: #F39C12;
      text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
                   0 0 30px rgba(243,156,18,0.6);
    }
  </style>
</head>
<body>

<div class="thumbnail">

  <div class="bg-scene">
    <img class="bg-scene-img" src="assets/dust2-bg.webp" alt=""
         onerror="this.style.display='none'" />
  </div>
  <div class="bg-stripe"></div>
  <div class="dust-overlay"></div>

  <!-- Badge V3 -->
  <div class="badge-ribbon">1ra PARTIDA</div>

  <!-- Kill feed V3 — headshot highlight -->
  <div class="killfeed">
    <div class="killfeed-row">
      <span class="kf-you">Drax</span>
      <span class="kf-icon"></span>
      <span class="kf-weapon">M4A4</span>
      <span class="kf-enemy">enemy</span>
    </div>
    <div class="killfeed-row" style="opacity:0.7;font-size:17px;">
      <span style="color:#aaa;">🎯 headshot</span>
    </div>
  </div>

  <!-- Face -->
